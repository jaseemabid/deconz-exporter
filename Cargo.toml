[package]
name = "deconz-exporter"
description = "A very simple (and naive) Prometheus exporter for deCONZ Phoscon zigbee gateway"
edition = "2024"
rust-version = "1.98"
version = "0.1.0"
license = "MIT"
authors = ["Jaseem Abid <me@jabid.in>"]
readme = "README.md"
repository = "https://github.com/jaseemabid/deconz-exporter"


[dependencies]
chrono = {version = "0.4.45", features = ["serde"]}
clap = {version = "4.6.7", features = ["derive", "env"]}
env_logger = "0.11.11"
lazy_static = "1.5.0"
log = "0.4.34"
prometheus = "0.14.0"
reqwest = {version = "0.13.5", features = ["json", "blocking"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
url = "2.5.8"
